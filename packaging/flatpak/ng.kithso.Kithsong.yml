# Flatpak build of the GTK app, bundled into one .flatpak by scripts/release-linux.sh.
#
# Not one for Flathub: CMake fetches the third-party sources at configure time, so the build
# needs the network (build-args below). Fine here, as we host our own repo.
id: ng.kithso.Kithsong
runtime: org.gnome.Platform
runtime-version: '51'  # also the container tag in .github/workflows/release.yml
sdk: org.gnome.Sdk
command: kithsong
# Composed by scripts/release-linux.sh instead: inside the build sandbox, the runtime's glycin
# image loaders can't start their own sandbox, so appstream can't read the icons.
appstream-compose: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # miniaudio plays through PulseAudio (PipeWire's, on most systems).
  - --socket=pulseaudio
  # LAN sync and mDNS discovery, MusicBrainz and cover art.
  - --share=network
  # The first run suggests a library in the Music folder, and the tagger writes into it. Folders
  # elsewhere come in through the file chooser portal. ~/Music too, as without user-dirs.dirs
  # (no xdg-user-dirs) xdg-music exposes nothing, while the first run still suggests ~/Music.
  - --filesystem=xdg-music
  - --filesystem=~/Music
  # desktop/linux/src/mpris.c
  - --own-name=org.mpris.MediaPlayer2.kithsong
modules:
  - name: kithsong
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      # secrets.local.cmake, written by the release script, sets the contact and the Last.fm key and secret.
      - >-
        cmake -S . -B _build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app
        -DKITHSONG_BUILD_TESTS=OFF
        $(test -f packaging/flatpak/secrets.local.cmake && echo -C packaging/flatpak/secrets.local.cmake)
      - cmake --build _build
      - cmake --install _build --component kithsong --strip
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .direnv
          - .vscode
          - android
          - build
          - dist
          - result

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The app icon: android/app/src/main/res/drawable/ic_launcher_foreground.xml (Material Icons'
       music_note, Apache 2.0) on the launcher background colour. Source for the Windows .ico and
       the Linux icons; regenerate those with packaging/icons/render.py after editing.
       Keep <svg> as the very first bytes: the Flatpak CI image's gdk-pixbuf recognises an SVG
       only by that, and flatpak build-export rejects the icon otherwise. -->

name: Deploy the website

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache generated image variants
        uses: actions/cache@v4
        with:
          path: site/.cache/images
          key: site-images-${{ hashFiles('site/**/*.jpg', 'site/**/*.png', 'site/**/*.gif', 'site/**/*.webp', 'site/ssg/images.py') }}
          restore-keys: site-images-

      - name: Test
        run: python -m unittest

      - id: pages
        uses: actions/configure-pages@v5

      - name: Require a root-level site
        if: steps.pages.outputs.base_path != ''
        run: |
          echo "::error::The site uses root-relative URLs (/img/, /docs/) and must be served from the domain root, but Pages will serve it under '${{ steps.pages.outputs.base_path }}'. Set the custom domain (kithso.ng) in Settings → Pages first."
          exit 1

      - name: Build
        run: python -m ssg build --base-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

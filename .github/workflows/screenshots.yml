# Store screenshots, by hand only (Actions > Store screenshots > Run workflow). Never on a tag
# and never from release.yml: a v* tag publishes at once, and nothing here may hold that up.
# Output is an artifact per job; nothing is committed.
#
# Jobs:
#   android  Robolectric + Roborazzi on the JVM, no emulator: the phone (1080x1920), the 7"
#            tablet (1080x1920, portrait) and the 10" tablet (2560x1440, landscape), each in
#            the listing's light and dark set.
#   wear     The same for the watch (384x384, masked round).
# Both draw the store's six made-up albums (the listing's albums.py), from the tests' own data.
# The tests run only with -PkithsongScreenshots, so a plain testDebugUnitTest skips them, and a
# run of unit tests alone doesn't build the native core.
name: Store screenshots

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which: all, or a comma list of android,wear'
        default: all

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # As release.yml: Gradle configures :native with them, and the SDK's CMake writes the
      # string resources, though no native code is built here.
      - name: Install the NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.2.12479018" "cmake;3.30.5" >/dev/null
      - name: Draw the screenshots
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest -PkithsongScreenshots
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-android
          path: android/app/build/outputs/store-screenshots/
          if-no-files-found: error

  wear:
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'wear')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install the NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.2.12479018" "cmake;3.30.5" >/dev/null
      - name: Draw the screenshots
        working-directory: android
        run: ./gradlew :wear:testDebugUnitTest -PkithsongScreenshots
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-wear
          path: android/wear/build/outputs/store-screenshots/
          if-no-files-found: error

# PROTOTYPE, not wired up: store screenshots, by hand only (Actions > Store screenshots > Run
# workflow). Never on a tag: a v* tag publishes at once, and nothing here may hold that up.
# Output is one artifact per job, then one zip of everything; nothing is committed.
#
# Jobs:
#   wear-jvm     Robolectric + Roborazzi on the JVM (no emulator): the watch screens.
#   android-emu  One phone AVD, resized with wm size/density for phone, 7" and 10" tablet.
#   windows      The release build, a seeded --config-dir, PrintWindow.
#   linux        The tarball build under a headless compositor, grim.
# The demo library comes from one generator in the core (see the proposal), so every job
# shows the same six fictional albums.
name: Store screenshots

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which: all, or a comma list of wear,android,windows,linux'
        default: all

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wear-jvm:
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'wear')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      # :native's CMake build still runs for unit tests today; the NDK is needed until it doesn't.
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.30.5" >/dev/null'
      - working-directory: android
        run: ./gradlew :wear:testDebugUnitTest --tests '*StoreScreenshotTest' -PkithsongAbis=x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-wear
          path: android/wear/build/outputs/roborazzi/*.png
          if-no-files-found: error

  android-emu:
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.30.5" >/dev/null'
      - working-directory: android
        run: ./gradlew :app:assembleDebug -PkithsongAbis=x86_64
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          # One boot for every size: the script installs, seeds the demo library, enters the
          # demo status bar, and shoots each of phone 1080x1920, 7" 1080x1920@288 and
          # 10" 1440x2560@288 (landscape) in light and dark.
          script: bash scripts/store-screenshots/android.sh out/android
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-android
          path: out/android/*.png
          if-no-files-found: error

  windows:
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Same toolchain steps as release.yml's windows job (llvm-mingw, Ninja, deps cache).
      - shell: pwsh
        run: scripts/release-windows.ps1 -Arch x64
      # Seeds a scratch --config-dir (settings.json: library_dir, firewall_dont_ask,
      # device_name) with the demo library, launches with KITHSONG_THEME=light|dark and a fixed
      # window size, waits for the window, PrintWindow(PW_RENDERFULLCONTENT), crops, exits.
      - shell: pwsh
        run: scripts/store-screenshots/windows.ps1 -Out out/windows
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-windows
          path: out/windows/*.png
          if-no-files-found: error

  linux:
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libadwaita-1-dev libgtk-4-dev ninja-build \
            sway grim fonts-cantarell adwaita-icon-theme
      - run: bash scripts/release-linux-tarball.sh
      # sway --headless (WLR_BACKENDS=headless, one 1440x900 output), the app with
      # XDG_CONFIG_HOME pointing at a seeded config, ADW color scheme forced per shot, then
      # grim -g of the window's rect from swaymsg -t get_tree.
      - run: bash scripts/store-screenshots/linux.sh out/linux
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-linux
          path: out/linux/*.png
          if-no-files-found: error
